name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1" # weekly, Monday 03:xx UTC (live tests cost about 2 credits)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
      - run: for f in src/*.php tests/*.php; do php -l "$f"; done
      - run: php tests/UnitTest.php

  live:
    name: Live API
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Waits for approval from a required reviewer of the "live" environment (it spends credits).
    environment: live
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
      - run: php tests/LiveTest.php
        env:
          RUNCONVERT_API_KEY: ${{ secrets.RUNCONVERT_API_KEY }}
